# Pipeline di rilascio: controlli, immagine Docker su GHCR, deploy su Coolify.
# Nel repository dell'applicazione questo file sta in .github/workflows/deploy.yml
name: Deploy demo

on:
  push:
    branches: [demo]
  # Avvio manuale dalla scheda Actions
  workflow_dispatch:

env:
  # ghcr.io/<owner>/<repository>: il nome dell'immagine segue quello del repository
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  # Stessi controlli della CI: se fallisce non si builda e non si deploya nulla
  quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: app_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7
        ports: ['6379:6379']

    # Valori usa e getta del database di test, vivono solo dentro il runner
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: app_test
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, redis, bcmath, exif, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Migrations e seed
        run: php artisan migrate:fresh --seed --env=testing

      # Le view usano @vite: un manifest finto evita di buildare gli asset solo per i test
      - name: Manifest Vite per i test
        run: |
          mkdir -p public/build/assets
          printf '{"resources/css/app.css":{"file":"assets/app.css","src":"resources/css/app.css"},"resources/js/app.js":{"file":"assets/app.js","src":"resources/js/app.js","isEntry":true}}' > public/build/manifest.json
          touch public/build/assets/app.css public/build/assets/app.js

      - name: Tests
        run: ./vendor/bin/pest --stop-on-failure

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Code style
        run: ./vendor/bin/pint --test

  # Costruisce l'immagine e la pubblica su GHCR: il server non builda nulla
  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          # Riscarica l'immagine base a ogni build invece di riusare quella in cache
          pull: true
          tags: ${{ env.IMAGE }}:demo
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Chiede a Coolify di ridistribuire la risorsa con l'immagine appena pubblicata.
  # In Coolify l'auto-deploy è spento: il rilascio parte solo da qui, a controlli superati
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy su Coolify
        # Blocco "|": il comando contiene ": " e su una riga sola
        # renderebbe il file YAML non valido
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
